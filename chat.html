<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inside Chat — Sala Principal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="chat-body">
  <div class="chat-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-badge small">IC</div>
        <div>
          <h2>Inside Chat</h2>
          <span class="online-pill"><span class="dot"></span> En línea</span>
        </div>
      </div>

      <div class="user-profile">
        <div class="avatar" id="myAvatar">?</div>
        <div class="user-info">
          <span class="user-name" id="myName">—</span>
          <span class="user-email" id="myEmail">—</span>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Cerrar sesión">⏻</button>
      </div>

      <div class="sidebar-section">
        <h3>Canales</h3>
        <div class="channel-list" id="channelList">
          <button class="channel active" data-channel="general"># general</button>
          <button class="channel" data-channel="random"># random</button>
          <button class="channel" data-channel="proyectos"># proyectos</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Conectados <span id="onlineCount" class="count-badge">0</span></h3>
        <div class="online-list" id="onlineList">
          <p class="empty-note">Cargando…</p>
        </div>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="chat-main">
      <header class="chat-header">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div>
          <h2 id="channelTitle"># general</h2>
          <p id="channelSub">Sala pública de conversación</p>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="day-divider"><span>Hoy</span></div>
      </div>

      <div class="typing-indicator" id="typingIndicator" hidden>
        <span class="typing-name" id="typingName"></span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <input type="text" id="messageInput" placeholder="Escribe un mensaje…" maxlength="500" />
        <button type="submit" class="send-btn" title="Enviar">➤</button>
      </form>
    </main>
  </div>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
