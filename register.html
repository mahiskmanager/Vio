<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inside Chat — Crear Cuenta</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-badge">IC</div>
        <h1>Crear cuenta</h1>
        <p class="auth-subtitle">Únete a Inside Chat en segundos</p>
      </div>

      <div id="alertBox" class="alert hidden"></div>

      <form id="registerForm" autocomplete="off">
        <div class="field">
          <label for="displayName">Nombre de usuario</label>
          <input type="text" id="displayName" placeholder="Tu nombre visible" required maxlength="20" />
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6" />
        </div>
        <button type="submit" id="registerBtn" class="btn-primary">
          <span class="btn-text">Crear cuenta</span>
          <span class="spinner hidden"></span>
        </button>
      </form>

      <p class="auth-footer">
        ¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a>
      </p>
    </div>
    <p class="app-version">Inside Chat v1.0 · Firebase Realtime</p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
